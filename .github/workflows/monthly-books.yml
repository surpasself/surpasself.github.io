name: Monthly book discovery

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-books
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Discover this month's books
        run: >-
          python -m bookscout
          --profile config/books_profile.json
          --output book/data/current.json
          --audit-output book/data/candidate-audit.json

      - name: Open a reviewable monthly discovery PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "books: prepare monthly discovery"
          branch: automation/monthly-book-discovery
          delete-branch: true
          title: "Books: monthly discovery proposal"
          body: |
            Automated metadata scan only. Do not merge as a finished recommendation list
            until the candidates have been checked against publisher material, independent
            reviews, contrary evidence, and legal reading routes.
          add-paths: book/data
